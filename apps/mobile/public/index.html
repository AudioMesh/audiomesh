      rel="stylesheet"

    <style>
      /* Splash/Loading Screen Styles */
      html,
      body {
        margin: 0;
        padding: 0;
      }

      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        z-index: 9999;
        overflow: hidden;
        background-color: #121416;
        color: #ffffff;
        font-family:
          'Hanken Grotesk',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        /* Custom background mesh */
        background-image: radial-gradient(
            circle at center,
            rgba(186, 200, 215, 0.08) 0%,
            rgba(18, 20, 22, 1) 75%
          ),
          linear-gradient(rgba(255, 255, 255, 0.01) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.01) 1px,
            transparent 1px
          );
        background-size:
          100% 100%,
          24px 24px,
          24px 24px;
        position: relative;
      }

      /* Mesh Communication Network */
      .loader-mesh-container {
        position: relative;
        width: 220px;
        height: 220px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 1rem;
        animation: float 4s ease-in-out infinite;
      }

      .loader-logo-glow {
        position: absolute;
        width: 160px;
        height: 160px;
        background: radial-gradient(
          circle,
          rgba(186, 200, 215, 0.15) 0%,
          transparent 70%
        );
        filter: blur(15px);
        animation: pulse-glow 2s ease-in-out infinite alternate;
      }

      .loader-logo {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 70px;
        height: 70px;
        z-index: 4;
      }

      .loader-mesh-svg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      .loader-mesh-line {
        stroke: rgba(186, 200, 215, 0.4);
        stroke-width: 1.5;
        stroke-dasharray: 6, 4;
        animation: mesh-dash-anim 1s linear infinite;
      }

      @keyframes mesh-dash-anim {
        to {
          stroke-dashoffset: -20;
        }
      }

      .loader-satellite {
        position: absolute;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background-color: #1e2022;
        border: 1.5px solid #bac8d7;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 3;
        animation: satellite-pulse-anim 2s infinite ease-in-out;
      }

      .loader-satellite-1 { top: 30px; left: 30px; }
      .loader-satellite-2 { top: 30px; right: 30px; animation-delay: 0.5s; }
      .loader-satellite-3 { bottom: 30px; left: 30px; animation-delay: 1s; }
      .loader-satellite-4 { bottom: 30px; right: 30px; animation-delay: 1.5s; }

      .loader-satellite-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: #bac8d7;
      }

      @keyframes satellite-pulse-anim {
        0%, 100% {
          transform: scale(0.8);
          opacity: 0.5;
          box-shadow: 0 0 0 0 rgba(186, 200, 215, 0.4);
        }
        50% {
          transform: scale(1.1);
          opacity: 1;
          box-shadow: 0 0 10px 3px rgba(186, 200, 215, 0.7);
        }
      }

      /* Audio Equalizer for Sound Playback */
      .loader-eq-container {
        display: flex;
        gap: 3px;
        height: 20px;
        align-items: center;
        justify-content: center;
        margin-top: 0.5rem;
        margin-bottom: 1.5rem;
      }

      .loader-eq-bar {
        width: 3px;
        height: 100%;
        background-color: #bac8d7;
        border-radius: 10px;
        transform-origin: bottom;
        animation: eq-bar-anim 0.6s ease-in-out infinite alternate;
      }

      .loader-eq-bar:nth-child(1) { animation-duration: 0.5s; animation-delay: 0.08s; }
      .loader-eq-bar:nth-child(2) { animation-duration: 0.62s; animation-delay: 0.16s; }
      .loader-eq-bar:nth-child(3) { animation-duration: 0.74s; animation-delay: 0.24s; }
      .loader-eq-bar:nth-child(4) { animation-duration: 0.56s; animation-delay: 0.32s; }
      .loader-eq-bar:nth-child(5) { animation-duration: 0.68s; animation-delay: 0.40s; }
      .loader-eq-bar:nth-child(6) { animation-duration: 0.80s; animation-delay: 0.48s; }
      .loader-eq-bar:nth-child(7) { animation-duration: 0.62s; animation-delay: 0.56s; }
      .loader-eq-bar:nth-child(8) { animation-duration: 0.74s; animation-delay: 0.64s; }

      @keyframes eq-bar-anim {
        0% {
          transform: scaleY(0.2);
        }
        100% {
          transform: scaleY(1);
        }
      }

      /* Brand Title */
      .loader-title {
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: #ffffff;
        margin-bottom: 0.5rem;
        text-shadow: 0 0 15px rgba(186, 200, 215, 0.3);
      }

      .loader-subtitle {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.4);
        margin-bottom: 2rem;
        letter-spacing: 0.1em;
      }

      /* Progress Bar */
      .loader-progress-track {
        width: 200px;
        height: 3px;
        background-color: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
        overflow: hidden;
        position: relative;
      }

      .loader-progress-bar {
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, #34414d, #bac8d7);
        border-radius: 10px;
        position: absolute;
        animation: loading-bar 1.8s cubic-bezier(0.65, 0.05, 0.36, 1) infinite;
      }

      /* Terminal Logs for luxury aesthetic */
      .loader-terminal {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.7rem;
        color: rgba(186, 200, 215, 0.8);
        margin-top: 1.5rem;
        min-height: 1.2rem;
        letter-spacing: 0.05em;
      }

      .loader-terminal::after {
        content: '▋';
        animation: blink 1s step-end infinite;
      }

      /* Animations */
      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      @keyframes pulse-glow {
        0% {
          transform: scale(0.95);
          opacity: 0.6;
        }
        100% {
          transform: scale(1.15);
          opacity: 1;
        }
      }

      @keyframes loading-bar {
        0% {
          left: -40%;
          width: 30%;
        }
        50% {
          width: 50%;
        }
        100% {
          left: 110%;
          width: 20%;
        }
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      /* Audio Propagation Ripples */
      .loader-ripple {
        position: absolute;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: 1.5px solid rgba(186, 200, 215, 0.25);
        animation: ripple-anim 4s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
      }

      .loader-ripple-1 {
        animation-delay: 0s;
      }

      .loader-ripple-2 {
        border-color: rgba(186, 200, 215, 0.15);
        animation-delay: 1.3s;
      }

      .loader-ripple-3 {
        border-color: rgba(186, 200, 215, 0.08);
        animation-delay: 2.6s;
      }

      .loader-status-container {
        display: flex;
        align-items: center;
        margin-top: 1.5rem;
        margin-bottom: -0.5rem;
        height: 1.25rem;
      }

      .loader-status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: #bac8d7;
        margin-right: 8px;
        animation: pulse-dot-anim 2s infinite ease-in-out;
      }

      .loader-status-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        color: rgba(186, 200, 215, 0.6);
        letter-spacing: 0.1em;
      }

      @keyframes ripple-anim {
        0% {
          transform: scale(0.6);
          opacity: 0;
        }
        10% {
          opacity: 0.6;
        }
        100% {
          transform: scale(2);
          opacity: 0;
        }
      }

      @keyframes pulse-dot-anim {
        0% {
          transform: scale(0.9);
          opacity: 0.6;
          box-shadow: 0 0 0 0 rgba(186, 200, 215, 0.4);
        }
        50% {
          transform: scale(1.1);
          opacity: 1;
          box-shadow: 0 0 8px 2px rgba(186, 200, 215, 0.6);
        }
        100% {
          transform: scale(0.9);
          opacity: 0.6;
          box-shadow: 0 0 0 0 rgba(186, 200, 215, 0.4);
        }
      }
    </style>
  </head>

      // AudioMesh network synchronization logs
      const logs = [
        'INITIALIZING AUDIO SUBSYSTEM...',
